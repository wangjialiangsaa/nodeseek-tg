name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 tests/terminal-smoke.py
      - run: sudo python3 tests/menu-smoke.py
      - run: bash -n install.sh
      - run: docker compose config --quiet
      - run: docker build -t nodeseek-tg:test .
      - name: Container smoke test
        run: |
          docker run -d --name ns-test nodeseek-tg:test
          trap 'docker logs ns-test; docker rm -f ns-test' EXIT
          for attempt in $(seq 1 20); do
            if docker exec ns-test node src/health.mjs; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: One-command install and backup on Linux
        run: |
          target_dir="$RUNNER_TEMP/nodeseek-tg-install"
          cleanup() {
            if test -f "$target_dir/compose.yaml"; then
              sudo INSTALL_DIR="$target_dir" bash "$target_dir/install.sh" uninstall
            fi
          }
          trap cleanup EXIT
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            curl -fsSL https://raw.githubusercontent.com/wangjialiangsaa/nodeseek-tg/main/install.sh | sudo INSTALL_DIR="$target_dir" NONINTERACTIVE=1 bash -s -- install --repo wangjialiangsaa/nodeseek-tg
            curl -fsSL https://raw.githubusercontent.com/wangjialiangsaa/nodeseek-tg/399b38a/install.sh -o "$RUNNER_TEMP/legacy-installer.sh"
            sudo INSTALL_DIR="$target_dir" bash "$RUNNER_TEMP/legacy-installer.sh" update --repo wangjialiangsaa/nodeseek-tg
          else
            sudo INSTALL_DIR="$target_dir" NONINTERACTIVE=1 bash install.sh install
          fi
          sudo INSTALL_DIR="$target_dir" python3 tests/terminal-smoke.py -- bash "$target_dir/install.sh" config
          sudo INSTALL_DIR="$target_dir" bash "$target_dir/install.sh" status
          sudo docker compose --project-name nodeseek-tg -f "$target_dir/compose.yaml" exec -T nodeseek-tg node src/health.mjs
          sudo INSTALL_DIR="$target_dir" bash "$target_dir/install.sh" backup
          test -n "$(find "$target_dir/backups" -name '*.tar.gz' -size +0c -print -quit)"
