name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n install.sh
      - run: docker compose config --quiet
      - run: docker build -t nodeseek-tg:test .
      - name: Container smoke test
        run: |
          docker run -d --name ns-test -p 127.0.0.1:8787:8787 -e ADMIN_PASSWORD=ci-only-password-123 nodeseek-tg:test
          trap 'docker logs ns-test; docker rm -f ns-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: One-command install and backup on Linux
        run: |
          target_dir="$RUNNER_TEMP/nodeseek-tg-install"
          cleanup() {
            if test -f "$target_dir/compose.yaml"; then
              sudo INSTALL_DIR="$target_dir" bash "$target_dir/install.sh" uninstall
            fi
          }
          trap cleanup EXIT
          curl -fsSL https://raw.githubusercontent.com/wangjialiangsaa/nodeseek-tg/main/install.sh | sudo INSTALL_DIR="$target_dir" PORT=18787 bash -s -- install --repo wangjialiangsaa/nodeseek-tg
          curl --fail --silent http://127.0.0.1:18787/health
          sudo INSTALL_DIR="$target_dir" bash "$target_dir/install.sh" backup
          test -n "$(find "$target_dir/backups" -name '*.tar.gz' -size +0c -print -quit)"
